name: Release

# Push a tag like v1.2.0 (matching "version" in public/manifest.json) to publish a GitHub Release
# with the installable zip attached.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build & publish release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Check tag matches manifest version
        id: version
        run: |
          version=$(node -p "require('./public/manifest.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - run: npm ci

      - name: Type check and test
        run: |
          npm run typecheck
          npm test

      - name: Build package (no API keys)
        run: npx tsx scripts/package.ts

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sed "s/{{VERSION}}/$VERSION/g" .github/RELEASE_TEMPLATE.md > notes.md
          gh release create "$GITHUB_REF_NAME" "release/ai-tab-organizer-$VERSION.zip" \
            --title "AI Tab Organizer $VERSION" \
            --notes-file notes.md \
            --verify-tag
